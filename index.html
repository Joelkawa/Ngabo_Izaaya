<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Family Tree (Father > Mother Fallback)</title>
    <style>
        /* --- General Layout --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            text-align: center;
            padding: 20px;
        }

        /* --- Tree Container --- */
        .tree-wrapper {
            width: 100%;
            overflow-x: auto;
            padding-bottom: 60px;
        }

        .tree {
            display: inline-block;
            white-space: nowrap;
            min-width: 100%;
        }

        .tree ul {
            padding-top: 20px; 
            position: relative;
            transition: all 0.5s;
            display: flex;
            justify-content: center;
        }

        .tree li {
            float: left; text-align: center;
            list-style-type: none;
            position: relative;
            padding: 20px 5px 0 5px;
            transition: all 0.5s;
        }

        /* Connectors */
        .tree li::before, .tree li::after {
            content: ''; position: absolute; top: 0; right: 50%;
            border-top: 2px solid #999; width: 50%; height: 20px;
        }
        .tree li::after { right: auto; left: 50%; border-left: 2px solid #999; }
        .tree li:first-child::before { border: 0 none; }
        .tree li:last-child::after { border: 0 none; }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree ul ul::before {
            content: ''; position: absolute; top: 0; left: 50%;
            border-left: 2px solid #999; width: 0; height: 20px;
        }

        /* --- Person Card --- */
        .card {
            border: 1px solid #ccc;
            padding: 10px;
            display: inline-block;
            border-radius: 8px;
            background: white;
            min-width: 120px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .card:hover {
            background: #e3f2fd;
            border-color: #2196f3;
            transform: translateY(-3px);
            transition: 0.3s;
        }

        .name { font-weight: 700; color: #333; font-size: 1.1em; }
        .details { font-size: 0.85em; color: #666; margin-top: 5px; }
        
        /* Badges for connection type */
        .badge {
            font-size: 0.7em;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            display: inline-block;
            margin-top: 4px;
        }
        .badge-dad { background-color: #4caf50; } /* Green for Father link */
        .badge-mom { background-color: #e91e63; } /* Pink for Mother link */
        .badge-root { background-color: #607d8b; }

        /* --- Missing / Orphan Section --- */
        .orphan-zone {
            margin-top: 40px;
            border-top: 2px dashed #ff5722;
            padding: 20px;
            background: #fff3e0;
            display: none; /* Hidden if empty */
        }
        .orphan-title { color: #d84315; font-weight: bold; margin-bottom: 15px; }
        .orphan-list { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        
        .orphan-card {
            border: 1px solid #ffab91;
            background: #fff;
            padding: 10px;
            border-radius: 5px;
            color: #d84315;
        }

    </style>
</head>
<body>

    <h2>Family Tree (Father Priority > Mother Fallback)</h2>

    <div class="tree-wrapper">
        <div class="tree" id="tree-root"></div>
    </div>

    <div id="orphan-section" class="orphan-zone">
        <div class="orphan-title">⚠ Connections Not Found</div>
        <div class="orphan-list" id="orphan-list"></div>
    </div>

    <script>
        // 1. DATA: Note I added a Mother-only scenario and an Orphan scenario
        const apiData = {
            "items": [
                // The Main Father Line
                { "first_name": "Ngabo", "last_name": "Izaaya", "father_name": "", "mother_name": "", "id": 1 },
                { "first_name": "Bashisha", "last_name": "H", "father_name": "Ngabo Izaaya", "mother_name": "", "id": 2 },
                { "first_name": "Zzavuga", "last_name": "Z", "father_name": "Ngabo Izaaya", "mother_name": "", "id": 3 },
                
                // NEW: Mother Logic Test
                // 'Nalule' has no father listed, she is a Root.
                { "first_name": "Nalule", "last_name": "Rose", "father_name": "", "mother_name": "", "id": 10 },
                // 'Junior' lists 'Ngabo' (Father) but he DOES exist. 
                // BUT, let's say Junior lists a Missing Father, but a Valid Mother.
                { "first_name": "Junior", "last_name": "Rose", "father_name": "Missing Man", "mother_name": "Nalule Rose", "id": 11 },

                // ORPHAN: Lists parents that don't exist in this JSON
                { "first_name": "Lost", "last_name": "Soul", "father_name": "Unknown Guy", "mother_name": "Unknown Lady", "id": 99 }
            ]
        };

        // 2. LOGIC
        function buildTree(dataItems) {
            const map = {};
            const roots = [];
            const orphans = [];

            // A. Indexing: Create a map of "FullName -> Object"
            dataItems.forEach((person, index) => {
                person.fullName = `${person.first_name} ${person.last_name || ''}`.trim();
                person.children = [];
                person.connectionType = null; // To track if linked via Mom or Dad
                map[person.fullName] = index;
            });

            // B. Linking
            dataItems.forEach(person => {
                const fatherName = (person.father_name || '').trim();
                const motherName = (person.mother_name || '').trim();
                
                let isLinked = false;

                // Priority 1: Try Father
                if (fatherName && map[fatherName] !== undefined) {
                    dataItems[map[fatherName]].children.push(person);
                    person.connectionType = 'Father';
                    isLinked = true;
                } 
                // Priority 2: Try Mother (Only if not linked to father)
                else if (motherName && map[motherName] !== undefined) {
                    dataItems[map[motherName]].children.push(person);
                    person.connectionType = 'Mother';
                    isLinked = true;
                }

                // C. Categorize Unlinked People
                if (!isLinked) {
                    // If they had NO parents listed, they are a Root
                    if (!fatherName && !motherName) {
                        person.connectionType = 'Root';
                        roots.push(person);
                    } else {
                        // They had parents listed, but we couldn't find them in the map
                        orphans.push(person);
                    }
                }
            });

            return { roots, orphans };
        }

        // 3. HTML GENERATION (Recursive)
        function generateHtml(person) {
            let badgeClass = '';
            let badgeText = '';

            // Visual badge logic
            if (person.connectionType === 'Father') {
                badgeClass = 'badge-dad';
                badgeText = 'Via Father';
            } else if (person.connectionType === 'Mother') {
                badgeClass = 'badge-mom';
                badgeText = 'Via Mother';
            } else {
                badgeClass = 'badge-root';
                badgeText = 'Root';
            }

            let html = `
                <li>
                    <div class="card">
                        <div class="name">${person.first_name}</div>
                        <div class="badge ${badgeClass}">${badgeText}</div>
                    </div>
            `;

            if (person.children.length > 0) {
                html += '<ul>';
                person.children.forEach(child => {
                    html += generateHtml(child);
                });
                html += '</ul>';
            }

            html += '</li>';
            return html;
        }

        // 4. INIT
        const { roots, orphans } = buildTree(apiData.items);
        const treeContainer = document.getElementById('tree-root');
        
        // Render Tree
        if (roots.length > 0) {
            let ul = document.createElement('ul');
            roots.forEach(root => {
                ul.innerHTML += generateHtml(root);
            });
            treeContainer.appendChild(ul);
        }

        // Render Orphans
        if (orphans.length > 0) {
            document.getElementById('orphan-section').style.display = 'block';
            const orphanList = document.getElementById('orphan-list');
            orphans.forEach(o => {
                const div = document.createElement('div');
                div.className = 'orphan-card';
                div.innerHTML = `<strong>${o.first_name}</strong><br><small>Missing Link</small>`;
                orphanList.appendChild(div);
            });
        }

    </script>
</body>
</html>
